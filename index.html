<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="quiz-card card p-4 shadow">

      <section id="start-screen" class="text-center">
        <h1>Quiz App</h1>
        <p>Answer 10 questions and see your score!</p>
        <button id="start-btn" class="btn btn-primary" onClick="startQuiz();">Start Quiz</button>
      </section>

      <section id="quiz-screen" style="display: none;">
        <div class="d-flex justify-content-between mb-2">
          <span id="question-count">Question 1 of 10</span>
          <span id="score">Score: 0</span>
        </div>
        <div class="progress mb-3">
          <div id="progress-bar" class="progress-bar" style="width: 10%"></div>
        </div>
        <h4 id="question-text">Question goes here?</h4>
        <div id="options" class="d-grid gap-2 my-3"></div>
        <button id="next-btn" class="btn btn-primary" onClick="nextQuestion();">Next</button>
      </section>

      <section id="result-screen" class="text-center" style="display: none;">
        <h2>Quiz Complete!</h2>
        <p class="fs-4" id="final-score">You scored 0 / 10</p>
        <p id="result-message">Great job!</p>
        <button id="restart-btn" class="btn btn-success" onClick="restartQuiz();">Restart</button>
      </section>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
